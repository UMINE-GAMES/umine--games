<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Fruit Slice</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
touch-action:none;
font-family:Arial;
background:#16213e;
}

#game{
position:fixed;
inset:0;
overflow:hidden;
background:linear-gradient(#172554,#0f172a);
}

/* HUD */

#hud{
position:fixed;
top:15px;
left:15px;
right:15px;

display:flex;
justify-content:space-between;

color:white;
font-size:20px;
font-weight:bold;

z-index:50;

text-shadow:2px 2px 4px black;
}

#score{
position:fixed;
top:55px;
width:100%;

text-align:center;

color:white;
font-size:42px;
font-weight:bold;

z-index:50;

text-shadow:3px 3px 5px black;
}

/* FRUITS */

.fruit{
position:absolute;

width:65px;
height:65px;

display:flex;
align-items:center;
justify-content:center;

font-size:52px;

user-select:none;
pointer-events:none;

z-index:20;
}

/* BOMB */

.bomb{
position:absolute;

width:65px;
height:65px;

display:flex;
align-items:center;
justify-content:center;

font-size:50px;

pointer-events:none;

z-index:20;
}

/* SLICE */

.slash{
position:absolute;

height:5px;

background:white;

border-radius:5px;

box-shadow:
0 0 8px white,
0 0 15px white;

pointer-events:none;

z-index:40;

transform-origin:left center;
}

/* START SCREEN */

#menu{
position:fixed;

inset:0;

background:rgba(0,0,0,.8);

display:flex;

flex-direction:column;

justify-content:center;
align-items:center;

color:white;

text-align:center;

z-index:100;
}

#menu h1{
font-size:45px;

margin-bottom:15px;

text-shadow:4px 4px #000;
}

#menu p{
font-size:18px;

line-height:30px;

margin-bottom:25px;
}

button{
padding:14px 35px;

border:3px solid white;

border-radius:12px;

background:#ff6b18;

color:white;

font-size:20px;

font-weight:bold;
}

</style>
</head>

<body>

<div id="game">

<div id="hud">

<span>
BEST: <span id="best">0</span>
</span>

<span>
❤️ <span id="lives">3</span>
</span>

</div>


<div id="score">
0
</div>


<div id="menu">

<h1>🍉 FRUIT SLICE</h1>

<p>
Swipe your finger to slice fruits<br>
Don't slice the bombs 💣
</p>

<button id="start">
START
</button>

</div>

</div>


<script>

/* =========================
   GAME VARIABLES
========================= */

let score=0;

let best=
Number(localStorage.getItem("fruitBest") || 0);

let lives=3;

let playing=false;

let fruits=[];

let spawnTimer;

let gameAnimation;


/* =========================
   ELEMENTS
========================= */

const game=
document.getElementById("game");

const scoreText=
document.getElementById("score");

const bestText=
document.getElementById("best");

const livesText=
document.getElementById("lives");

const menu=
document.getElementById("menu");

const startButton=
document.getElementById("start");


bestText.textContent=best;


/* =========================
   FRUIT LIST
========================= */

const fruitTypes=[
"🍎",
"🍊",
"🍉",
"🍓",
"🍌",
"🍍",
"🥝",
"🍑",
"🍇"
];


/* =========================
   START GAME
========================= */

function startGame(e){

if(e){

e.preventDefault();
e.stopPropagation();

}


fruits.forEach(f=>{

if(f.element)
f.element.remove();

});


fruits=[];


score=0;

lives=3;


scoreText.textContent="0";

livesText.textContent="3";


playing=true;


menu.style.display="none";


clearInterval(spawnTimer);

cancelAnimationFrame(gameAnimation);


spawnTimer=
setInterval(
spawnFruit,
700
);


gameAnimation=
requestAnimationFrame(update);

}


/* =========================
   SPAWN FRUIT
========================= */

function spawnFruit(){

if(!playing)
return;


let isBomb=
Math.random()<0.15;


let element=
document.createElement("div");


element.className=
isBomb
?"bomb"
:"fruit";


if(isBomb){

element.textContent="💣";

}else{

element.textContent=
fruitTypes[
Math.floor(
Math.random()*fruitTypes.length
)
];

}


let size=65;


let x=
Math.random()*
(innerWidth-size);


let y=
innerHeight+70;


let velocityX=
(Math.random()-.5)*6;


let velocityY=
-(10+Math.random()*6);


element.style.left=
x+"px";

element.style.top=
y+"px";


game.appendChild(element);


fruits.push({

element:element,

x:x,

y:y,

vx:velocityX,

vy:velocityY,

size:size,

bomb:isBomb,

sliced:false

});

}


/* =========================
   UPDATE GAME
========================= */

function update(){

if(!playing)
return;


for(
let i=fruits.length-1;
i>=0;
i--
){

let f=fruits[i];


f.vy+=0.25;


f.x+=f.vx;

f.y+=f.vy;


if(
f.x<0 ||
f.x>innerWidth-f.size
){

f.vx*=-1;

}


f.element.style.left=
f.x+"px";

f.element.style.top=
f.y+"px";


if(
f.y>
innerHeight+100
){

if(
!f.bomb &&
!f.sliced
){

lives--;

livesText.textContent=
lives;


if(lives<=0){

gameOver();

}

}


f.element.remove();

fruits.splice(i,1);

}

}


gameAnimation=
requestAnimationFrame(update);

}


/* =========================
   SLICE SYSTEM
========================= */

let slicing=false;

let lastX=0;

let lastY=0;


game.addEventListener(
"pointerdown",
function(e){

if(!playing)
return;


slicing=true;


lastX=e.clientX;

lastY=e.clientY;

}
);


game.addEventListener(
"pointermove",
function(e){

if(
!playing ||
!slicing
)
return;


let x=e.clientX;

let y=e.clientY;


drawSlash(
lastX,
lastY,
x,
y
);


checkSlice(
lastX,
lastY,
x,
y
);


lastX=x;

lastY=y;

}
);


game.addEventListener(
"pointerup",
function(){

slicing=false;

}
);


game.addEventListener(
"pointercancel",
function(){

slicing=false;

}
);


/* =========================
   CHECK SLICE
========================= */

function checkSlice(
x1,
y1,
x2,
y2
){

for(
let i=fruits.length-1;
i>=0;
i--
){

let f=fruits[i];


if(f.sliced)
continue;


let centerX=
f.x+f.size/2;

let centerY=
f.y+f.size/2;


let distance=
pointToLine(
centerX,
centerY,
x1,
y1,
x2,
y2
);


if(
distance<
f.size*.6
){

f.sliced=true;


if(f.bomb){

gameOver();

return;

}


score++;


scoreText.textContent=
score;


if(score>best){

best=score;

bestText.textContent=
best;

localStorage.setItem(
"fruitBest",
best
);

}


createPop(
centerX,
centerY
);


f.element.remove();

fruits.splice(i,1);

}

}

}


/* =========================
   LINE DISTANCE
========================= */

function pointToLine(
px,
py,
x1,
y1,
x2,
y2
){

let dx=x2-x1;

let dy=y2-y1;


if(
dx===0 &&
dy===0
){

return Math.hypot(
px-x1,
py-y1
);

}


let t=
(
(px-x1)*dx+
(py-y1)*dy
)/
(
dx*dx+
dy*dy
);


t=
Math.max(
0,
Math.min(1,t)
);


let closestX=
x1+t*dx;

let closestY=
y1+t*dy;


return Math.hypot(
px-closestX,
py-closestY
);

}


/* =========================
   SLASH EFFECT
========================= */

function drawSlash(
x1,
y1,
x2,
y2
){

let slash=
document.createElement("div");


slash.className="slash";


let dx=x2-x1;

let dy=y2-y1;


let length=
Math.hypot(dx,dy);


let angle=
Math.atan2(dy,dx);


slash.style.left=
x1+"px";

slash.style.top=
y1+"px";

slash.style.width=
length+"px";


slash.style.transform=
`rotate(${angle}rad)`;


game.appendChild(slash);


setTimeout(
function(){

slash.remove();

},
100
);

}


/* =========================
   POP EFFECT
========================= */

function createPop(x,y){

let pop=
document.createElement("div");


pop.textContent="✨";

pop.style.position=
"absolute";

pop.style.left=
x+"px";

pop.style.top=
y+"px";

pop.style.fontSize=
"35px";

pop.style.zIndex=
"60";

pop.style.pointerEvents=
"none";


game.appendChild(pop);


setTimeout(
function(){

pop.remove();

},
250
);

}


/* =========================
   GAME OVER
========================= */

function gameOver(){

if(!playing)
return;


playing=false;


clearInterval(spawnTimer);

cancelAnimationFrame(
gameAnimation
);


menu.style.display=
"flex";


menu.innerHTML=`

<h1>GAME OVER 💥</h1>

<p>
Score: ${score}<br>
Best: ${best}
</p>

<button id="restart">
PLAY AGAIN
</button>

`;


document
.getElementById("restart")
.addEventListener(
"pointerdown",
startGame
);

}


/* =========================
   START BUTTON
========================= */

startButton.addEventListener(
"pointerdown",
startGame
);

</script>

</body>
  </html>
