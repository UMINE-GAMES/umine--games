<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Flappy Bird Pixel</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  touch-action:none;
  font-family:monospace;
  image-rendering:pixelated;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#59c9ff;
}

/* SKY */

#sun{
  position:absolute;
  width:65px;
  height:65px;
  right:25px;
  top:30px;
  background:#ffe34d;
  border:6px solid #e5a928;
}

.cloud{
  position:absolute;
  width:100px;
  height:28px;
  background:#fff;
  border:5px solid #d8f2ff;
}

.cloud:before,
.cloud:after{
  content:"";
  position:absolute;
  background:#fff;
  border:5px solid #d8f2ff;
}

.cloud:before{
  width:35px;
  height:35px;
  left:10px;
  top:-22px;
}

.cloud:after{
  width:42px;
  height:42px;
  right:8px;
  top:-27px;
}

/* HUD */

#hud{
  position:fixed;
  top:10px;
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:50;

  color:white;
  font-weight:bold;
  text-shadow:4px 4px #222;
}

#score{
  font-size:44px;
}

#coinBox,
#bestBox{
  font-size:19px;
}

#powerStatus{
  position:fixed;
  top:62px;
  left:0;
  right:0;
  text-align:center;

  color:white;
  font-weight:bold;
  font-size:15px;

  text-shadow:3px 3px #222;
  z-index:50;
}

/* BIRD */

#bird{
  position:absolute;

  width:44px;
  height:34px;

  left:25%;

  background:#ffd21f;
  border:5px solid #222;

  z-index:20;
}

#birdEye{
  position:absolute;
  width:9px;
  height:9px;

  background:white;
  border:3px solid #222;

  right:5px;
  top:4px;
}

#birdEye:after{
  content:"";
  position:absolute;

  width:4px;
  height:4px;

  background:#111;

  right:0;
  bottom:0;
}

#beak{
  position:absolute;

  width:17px;
  height:11px;

  right:-17px;
  top:14px;

  background:#ff7b19;
  border:4px solid #222;
}

#wing{
  position:absolute;

  width:19px;
  height:13px;

  left:4px;
  bottom:2px;

  background:#e5a900;
  border:4px solid #222;
}

/* SHIELD */

#shield{
  position:absolute;

  width:64px;
  height:64px;

  left:-15px;
  top:-20px;

  border:5px dashed #31aaff;

  display:none;

  z-index:-1;
}

#bird.shield #shield{
  display:block;
}

/* PIPES */

.pipe{
  position:absolute;

  width:64px;

  background:#36b83e;

  border:6px solid #176b22;

  z-index:10;
}

.pipeCap{
  position:absolute;

  width:78px;
  height:28px;

  left:-13px;

  background:#43c84b;

  border:6px solid #176b22;
}

/* COINS */

.coin{
  position:absolute;

  width:28px;
  height:28px;

  background:#ffd21f;

  border:5px solid #bd7c00;

  z-index:25;

  box-shadow:
    4px 4px 0 #e0a300;
}

.coin:after{
  content:"$";

  position:absolute;

  inset:0;

  text-align:center;

  line-height:19px;

  color:#a36a00;

  font-weight:bold;
}

/* POWER */

.power{
  position:absolute;

  width:40px;
  height:40px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#222;

  border:5px solid white;

  z-index:26;

  font-size:22px;

  box-shadow:5px 5px 0 #111;
}

/* GROUND */

#ground{
  position:absolute;

  bottom:0;
  left:0;

  width:100%;
  height:75px;

  background:#d8ad3d;

  border-top:8px solid #31943b;

  z-index:40;
}

/* MESSAGE */

#message{
  position:fixed;
  inset:0;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.7);

  color:white;

  text-align:center;

  z-index:100;
}

#message h1{
  font-size:38px;

  text-shadow:
    5px 5px #222;

  margin-bottom:15px;
}

#message p{
  font-size:17px;
  line-height:27px;

  margin-bottom:20px;
}

button{
  font-family:monospace;

  padding:13px 30px;

  font-size:19px;
  font-weight:bold;

  border:5px solid #222;

  background:#ffd21f;

  color:#222;

  box-shadow:
    5px 5px 0 #111;
}

</style>
</head>

<body>

<div id="game">

  <div id="sun"></div>

  <div class="cloud"
       style="left:8%;top:100px"></div>

  <div class="cloud"
       style="left:62%;top:170px"></div>


  <div id="hud">

    <div id="coinBox">
      🪙 <span id="coins">0</span>
    </div>

    <div id="score">0</div>

    <div id="bestBox">
      🏆 <span id="best">0</span>
    </div>

  </div>


  <div id="powerStatus"></div>


  <div id="bird">

    <div id="shield"></div>

    <div id="birdEye"></div>

    <div id="beak"></div>

    <div id="wing"></div>

  </div>


  <div id="ground"></div>


  <div id="message">

    <h1>FLAPPY BIRD</h1>

    <p>
      TAP TO FLY<br>
      COLLECT COINS & POWER UPS<br>
      DON'T HIT THE PIPES
    </p>

    <button id="play">
      PLAY
    </button>

  </div>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const game =
document.getElementById("game");

const bird =
document.getElementById("bird");

const scoreText =
document.getElementById("score");

const coinsText =
document.getElementById("coins");

const bestText =
document.getElementById("best");

const powerStatus =
document.getElementById("powerStatus");

const message =
document.getElementById("message");

const playButton =
document.getElementById("play");


/* =========================
   VARIABLES
========================= */

let running=false;

let birdY=0;

let velocity=0;

let gravity=.45;

let flapPower=-7.5;

let pipes=[];

let coins=[];

let powers=[];

let pipeTimer=0;

let coinTimer=0;

let powerTimer=0;

let score=0;

let coinCount=0;

let best=
Number(
localStorage.getItem("flappyPixelBest")
)||0;

let shield=false;

let magnet=false;

let slow=false;

let powerEnd=0;

let magnetEnd=0;

let slowEnd=0;

let lastTime=0;


/* =========================
   AUDIO
========================= */

let audio=null;

function startAudio(){

  if(!audio){

    audio=new(
      window.AudioContext ||
      window.webkitAudioContext
    )();

  }

  if(audio.state==="suspended"){
    audio.resume();
  }

}

function sound(
  frequency,
  duration
){

  if(!audio)return;

  const o=
  audio.createOscillator();

  const g=
  audio.createGain();

  o.type="square";

  o.frequency.value=
  frequency;

  g.gain.value=.06;

  o.connect(g);

  g.connect(audio.destination);

  o.start();

  o.stop(
    audio.currentTime+
    duration
  );

}


/* =========================
   FLAP
========================= */

function flap(){

  if(!running)return;

  velocity=flapPower;

  sound(550,.07);

}


/* =========================
   CREATE PIPE
========================= */

function createPipe(){

  const gap=160;

  const minTop=75;

  const maxTop=
    window.innerHeight-
    75-
    gap-
    80;

  const topHeight=
    minTop+
    Math.random()*
    (maxTop-minTop);


  /* TOP */

  const top=
  document.createElement("div");

  top.className="pipe";

  top.style.height=
    topHeight+"px";

  top.style.top="0";

  top.style.left=
    window.innerWidth+"px";


  const topCap=
  document.createElement("div");

  topCap.className="pipeCap";

  topCap.style.bottom="-22px";

  top.appendChild(topCap);

  game.appendChild(top);


  /* BOTTOM */

  const bottom=
  document.createElement("div");

  bottom.className="pipe";

  const bottomHeight=
    window.innerHeight-
    75-
    topHeight-
    gap;

  bottom.style.height=
    bottomHeight+"px";

  bottom.style.bottom="75px";

  bottom.style.left=
    window.innerWidth+"px";


  const bottomCap=
  document.createElement("div");

  bottomCap.className="pipeCap";

  bottomCap.style.top="-22px";

  bottom.appendChild(bottomCap);

  game.appendChild(bottom);


  pipes.push({

    top,
    bottom,

    x:window.innerWidth,

    width:64,

    gapTop:topHeight,

    gapBottom:
      topHeight+gap,

    scored:false

  });

}


/* =========================
   SAFE ITEM POSITION
========================= */

function getSafeItemY(){

  /*
    Find a vertical position that
    is INSIDE the pipe gap.

    This means coins and power-ups
    can NEVER be inside a pipe.
  */

  if(pipes.length===0){

    return Math.max(
      100,
      Math.min(
        window.innerHeight-150,
        birdY
      )
    );

  }


  const last=
    pipes[pipes.length-1];

  const gapTop=
    last.gapTop;

  const gapBottom=
    last.gapBottom;


  /*
    Keep item away from both
    pipe edges.
  */

  const safeTop=
    gapTop+35;

  const safeBottom=
    gapBottom-35;


  if(safeBottom<=safeTop){

    return(
      gapTop+
      (gapBottom-gapTop)/2
    );

  }


  return(
    safeTop+
    Math.random()*
    (safeBottom-safeTop)
  );

}


/* =========================
   COIN
========================= */

function createCoin(){

  const coin=
  document.createElement("div");

  coin.className="coin";


  /*
    Put coin only in an
    open pipe gap.
  */

  const y=
    getSafeItemY();


  coin.style.left=
    window.innerWidth+"px";

  coin.style.top=
    y+"px";

  game.appendChild(coin);


  coins.push({

    element:coin,

    x:window.innerWidth,

    y:y

  });

}


/* =========================
   POWER UP
========================= */

function createPower(){

  const power=
  document.createElement("div");

  power.className="power";


  const types=[
    "shield",
    "magnet",
    "slow",
    "life"
  ];


  const type=
    types[
      Math.floor(
        Math.random()*types.length
      )
    ];


  if(type==="shield")
    power.textContent="🛡️";

  if(type==="magnet")
    power.textContent="🧲";

  if(type==="slow")
    power.textContent="⚡";

  if(type==="life")
    power.textContent="❤️";


  /*
    POWER-UP ALSO ONLY GOES
    INSIDE THE OPEN GAP.
  */

  const y=
    getSafeItemY();


  power.style.left=
    window.innerWidth+"px";

  power.style.top=
    y+"px";


  game.appendChild(power);


  powers.push({

    element:power,

    x:window.innerWidth,

    y:y,

    type:type

  });

}


/* =========================
   COLLISION
========================= */

function collision(a,b){

  return(
    a.left<b.right &&
    a.right>b.left &&
    a.top<b.bottom &&
    a.bottom>b.top
  );

}


/* =========================
   POWER
========================= */

function collectPower(type){

  sound(850,.12);


  if(type==="shield"){

    shield=true;

    bird.classList.add("shield");

    powerStatus.textContent=
      "SHIELD ACTIVE";

    powerEnd=
      performance.now()+8000;

  }


  if(type==="magnet"){

    magnet=true;

    powerStatus.textContent=
      "MAGNET ACTIVE";

    magnetEnd=
      performance.now()+7000;

  }


  if(type==="slow"){

    slow=true;

    powerStatus.textContent=
      "SLOW MOTION";

    slowEnd=
      performance.now()+6000;

  }


  if(type==="life"){

    powerStatus.textContent=
      "EXTRA LIFE +1";

  }

}


/* =========================
   POWER UPDATE
========================= */

function updatePowers(){

  const now=
    performance.now();


  if(
    shield &&
    now>powerEnd
  ){

    shield=false;

    bird.classList.remove(
      "shield"
    );

    powerStatus.textContent="";

  }


  if(
    magnet &&
    now>magnetEnd
  ){

    magnet=false;

    powerStatus.textContent="";

  }


  if(
    slow &&
    now>slowEnd
  ){

    slow=false;

    powerStatus.textContent="";

  }

}


/* =========================
   GAME OVER
========================= */

function gameOver(){

  running=false;

  sound(120,.3);


  if(score>best){

    best=score;

    localStorage.setItem(
      "flappyPixelBest",
      best
    );

  }


  message.style.display=
    "flex";


  message.innerHTML=`

    <h1>GAME OVER</h1>

    <p>
      SCORE: ${score}<br>
      COINS: ${coinCount}<br>
      BEST: ${best}
    </p>

    <button id="restart">
      RESTART
    </button>

  `;


  document
  .getElementById("restart")
  .addEventListener(
    "pointerdown",
    function(e){

      e.stopPropagation();

      startAudio();

      message.style.display=
        "none";

      resetGame();

    }
  );

}


/* =========================
   RESET
========================= */

function resetGame(){

  for(const p of pipes){

    p.top.remove();
    p.bottom.remove();

  }


  for(const c of coins){

    c.element.remove();

  }


  for(const p of powers){

    p.element.remove();

  }


  pipes=[];
  coins=[];
  powers=[];


  score=0;

  coinCount=0;

  birdY=
    window.innerHeight*.45;

  velocity=0;

  pipeTimer=.8;

  coinTimer=1;

  powerTimer=4;

  shield=false;

  magnet=false;

  slow=false;


  bird.classList.remove(
    "shield"
  );


  scoreText.textContent="0";

  coinsText.textContent="0";

  bestText.textContent=best;

  powerStatus.textContent="";


  bird.style.top=
    birdY+"px";

  bird.style.transform=
    "rotate(0deg)";


  running=true;

  lastTime=
    performance.now();

}


/* =========================
   UPDATE
========================= */

function update(dt){

  if(!running)return;


  updatePowers();


  /* BIRD */

  velocity+=
    gravity*dt*60;

  birdY+=
    velocity*dt*60;


  const angle=
    Math.max(
      -25,
      Math.min(
        90,
        velocity*4
      )
    );


  bird.style.transform=
    `rotate(${angle}deg)`;


  bird.style.top=
    birdY+"px";


  /* BOUNDARY */

  if(
    birdY<0 ||
    birdY+
    bird.offsetHeight>
    window.innerHeight-75
  ){

    if(shield){

      shield=false;

      bird.classList.remove(
        "shield"
      );

      velocity=-5;

      birdY=
        Math.max(
          20,
          Math.min(
            birdY,
            window.innerHeight-150
          )
        );

      sound(300,.1);

    }else{

      gameOver();

      return;

    }

  }


  /* SPEED */

  const speedMultiplier=
    slow?.65:1;

  const speed=
    (210+
    score*2)*
    speedMultiplier;


  /* PIPE */

  pipeTimer-=dt;


  if(pipeTimer<=0){

    createPipe();

    pipeTimer=
      1.55;

  }


  /* COIN */

  coinTimer-=dt;


  if(coinTimer<=0){

    /*
      Create coin AFTER a pipe
      so its gap is known.
    */

    if(pipes.length>0){

      createCoin();

    }

    coinTimer=.55;

  }


  /* POWER */

  powerTimer-=dt;


  if(powerTimer<=0){

    if(pipes.length>0){

      createPower();

    }

    powerTimer=
      7+
      Math.random()*4;

  }


  const birdRect=
    bird.getBoundingClientRect();


  /* =========================
     PIPES
  ========================= */

  for(
    let i=pipes.length-1;
    i>=0;
    i--
  ){

    const p=
      pipes[i];


    p.x-=
      speed*dt;


    p.top.style.left=
      p.x+"px";

    p.bottom.style.left=
      p.x+"px";


    const topRect=
      p.top.getBoundingClientRect();

    const bottomRect=
      p.bottom.getBoundingClientRect();


    if(
      collision(
        birdRect,
        topRect
      ) ||
      collision(
        birdRect,
        bottomRect
      )
    ){

      if(shield){

        shield=false;

        bird.classList.remove(
          "shield"
        );

        p.top.remove();

        p.bottom.remove();

        pipes.splice(i,1);

        powerStatus.textContent="";

        sound(700,.1);

        continue;

      }


      gameOver();

      return;

    }


    /* SCORE */

    if(
      !p.scored &&
      p.x+p.width<
      bird.offsetLeft
    ){

      p.scored=true;

      score++;

      scoreText.textContent=
        score;

      sound(800,.06);

    }


    /* REMOVE */

    if(
      p.x+p.width<-30
    ){

      p.top.remove();

      p.bottom.remove();

      pipes.splice(i,1);

    }

  }


  /* =========================
     COINS
  ========================= */

  for(
    let i=coins.length-1;
    i>=0;
    i--
  ){

    const c=
      coins[i];


    if(magnet){

      const targetX=
        birdRect.left+20;

      const targetY=
        birdRect.top+17;

      c.x+=
        (
          targetX-c.x
        )*
        dt*5;

      c.y+=
        (
          targetY-c.y
        )*
        dt*5;

    }else{

      c.x-=
        speed*dt;

    }


    c.element.style.left=
      c.x+"px";

    c.element.style.top=
      c.y+"px";


    const rect=
      c.element.getBoundingClientRect();


    if(
      collision(
        birdRect,
        rect
      )
    ){

      coinCount++;

      coinsText.textContent=
        coinCount;

      sound(950,.06);

      c.element.remove();

      coins.splice(i,1);

      continue;

    }


    if(c.x+28<-30){

      c.element.remove();

      coins.splice(i,1);

    }

  }


  /* =========================
     POWER UPS
  ========================= */

  for(
    let i=powers.length-1;
    i>=0;
    i--
  ){

    const p=
      powers[i];


    p.x-=
      speed*dt;


    p.element.style.left=
      p.x+"px";


    const rect=
      p.element.getBoundingClientRect();


    if(
      collision(
        birdRect,
        rect
      )
    ){

      collectPower(
        p.type
      );

      p.element.remove();

      powers.splice(i,1);

      continue;

    }


    if(p.x+40<-30){

      p.element.remove();

      powers.splice(i,1);

    }

  }

}


/* =========================
   TOUCH
========================= */

document.addEventListener(
  "pointerdown",
  function(e){

    if(!running)return;

    if(
      e.target===playButton ||
      e.target.id==="restart"
    ){

      return;

    }

    flap();

  },
  {passive:true}
);


/* =========================
   PLAY
========================= */

playButton.addEventListener(
  "pointerdown",
  function(e){

    e.stopPropagation();

    startAudio();

    message.style.display=
      "none";

    resetGame();

  }
);


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
  "keydown",
  function(e){

    if(
      e.code==="Space" ||
      e.code==="ArrowUp"
    ){

      flap();

    }

  }
);


/* =========================
   LOOP
========================= */

function loop(time){

  if(!lastTime){
    lastTime=time;
  }


  const dt=
    Math.min(
      (time-lastTime)/1000,
      .03
    );


  lastTime=time;


  update(dt);


  requestAnimationFrame(loop);

}


bestText.textContent=best;

requestAnimationFrame(loop);

</script>

</body>
</html>
