<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UMINE Aim Challenge</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0b0d12;
    color:white;
    text-align:center;
    overflow:hidden;
    touch-action:none;
}

h1{
    margin-top:15px;
    color:#00ff99;
}

#stats{
    display:flex;
    justify-content:center;
    gap:20px;
    margin:10px;
    font-size:18px;
}

#game{
    position:relative;
    width:min(94vw,420px);
    height:min(130vw,560px);
    max-height:68vh;
    margin:12px auto;
    background:#151922;
    border:3px solid #00ff99;
    border-radius:15px;
    overflow:hidden;
}

#target{
    position:absolute;
    width:75px;
    height:75px;
    border-radius:50%;
    background:#ff304f;
    border:6px solid white;
    box-shadow:0 0 20px #ff304f;
    display:none;
    transform:translate(-50%,-50%);
    touch-action:none;
}

#target::after{
    content:"";
    position:absolute;
    width:35%;
    height:35%;
    left:32.5%;
    top:32.5%;
    background:white;
    border-radius:50%;
}

#message{
    margin-top:10px;
    color:#aaa;
    font-size:15px;
}

#gameOver{
    display:none;
    font-size:27px;
    margin-top:12px;
}

#restart{
    margin-top:12px;
    padding:12px 25px;
    border:0;
    border-radius:10px;
    background:#00ff99;
    color:#07100d;
    font-size:18px;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>🎯 Aim Challenge</h1>

<div id="stats">
    <div>🎯 <span id="score">0</span></div>
    <div>⏱️ <span id="time">30</span></div>
    <div>🔥 <span id="combo">0</span></div>
</div>

<div id="game">
    <div id="target"></div>
</div>

<div id="message">
    Tap the moving target!
</div>

<div id="gameOver">
    💀 Game Over
    <br>
    <button id="restart">🔄 Restart</button>
</div>

<script>

const game = document.getElementById("game");
const target = document.getElementById("target");
const scoreText = document.getElementById("score");
const timeText = document.getElementById("time");
const comboText = document.getElementById("combo");
const gameOver = document.getElementById("gameOver");
const restart = document.getElementById("restart");

let score = 0;
let time = 30;
let combo = 0;
let misses = 0;
let running = false;
let timer;
let moveTimer;


/* START */

function startGame(){

    clearInterval(timer);
    clearInterval(moveTimer);

    score = 0;
    time = 30;
    combo = 0;
    misses = 0;
    running = true;

    scoreText.textContent = "0";
    timeText.textContent = "30";
    comboText.textContent = "0";

    gameOver.style.display = "none";
    target.style.display = "block";

    resizeTarget();

    moveTarget();

    timer = setInterval(function(){

        time--;

        timeText.textContent = time;

        if(time <= 0){
            endGame();
        }

    },1000);

    moveTimer = setInterval(function(){

        if(running){
            moveTarget();
        }

    },900);
}


/* TARGET SIZE */

function resizeTarget(){

    let size = Math.max(
        35,
        75 - Math.floor(score / 5) * 5
    );

    target.style.width = size + "px";
    target.style.height = size + "px";
}


/* MOVE TARGET */

function moveTarget(){

    const rect = game.getBoundingClientRect();

    const size = target.offsetWidth;

    const padding = size / 2 + 5;

    const x =
        padding +
        Math.random() *
        (rect.width - padding * 2);

    const y =
        padding +
        Math.random() *
        (rect.height - padding * 2);

    target.style.left = x + "px";
    target.style.top = y + "px";
}


/* HIT */

target.addEventListener("pointerdown",function(e){

    e.preventDefault();
    e.stopPropagation();

    if(!running){
        return;
    }

    score++;

    combo++;

    scoreText.textContent = score;
    comboText.textContent = combo;

    resizeTarget();

    moveTarget();
});


/* MISS */

game.addEventListener("pointerdown",function(e){

    if(!running){
        return;
    }

    if(e.target === target){
        return;
    }

    misses++;

    combo = 0;

    comboText.textContent = "0";

    if(misses >= 3){

        endGame();
    }
});


/* GAME OVER */

function endGame(){

    running = false;

    clearInterval(timer);
    clearInterval(moveTimer);

    target.style.display = "none";

    gameOver.style.display = "block";
}


/* RESTART */

restart.addEventListener("pointerdown",function(e){

    e.preventDefault();

    startGame();
});


/* START GAME */

startGame();

</script>

</body>
  </html>
