<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>2048</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  min-height:100%;
  font-family:Arial,sans-serif;
  background:#faf8ef;
  touch-action:none;
}

#game{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:25px;
}

.top{
  width:340px;
  max-width:92vw;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

h1{
  font-size:45px;
  color:#776e65;
}

.scores{
  display:flex;
  gap:7px;
}

.box{
  background:#bbada0;
  color:white;
  padding:7px 12px;
  border-radius:6px;
  text-align:center;
  font-size:12px;
  font-weight:bold;
}

.box b{
  display:block;
  font-size:19px;
}

#message{
  width:340px;
  max-width:92vw;
  color:#776e65;
  margin-bottom:12px;
  font-size:15px;
}

#board{
  width:340px;
  height:340px;
  max-width:92vw;
  max-height:92vw;

  padding:10px;

  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(4,1fr);
  gap:10px;

  background:#bbada0;
  border-radius:9px;
}

.cell{
  background:#cdc1b4;
  border-radius:6px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#776e65;
  font-size:28px;
  font-weight:bold;
}

.tile2{background:#eee4da;}
.tile4{background:#ede0c8;}
.tile8{background:#f2b179;color:white;}
.tile16{background:#f59563;color:white;}
.tile32{background:#f67c5f;color:white;}
.tile64{background:#f65e3b;color:white;}
.tile128{background:#edcf72;color:white;font-size:25px;}
.tile256{background:#edcc61;color:white;font-size:25px;}
.tile512{background:#edc850;color:white;font-size:25px;}
.tile1024{background:#edc53f;color:white;font-size:21px;}
.tile2048{background:#edc22e;color:white;font-size:21px;}

#restart{
  margin-top:15px;

  padding:12px 25px;

  border:0;
  border-radius:7px;

  background:#8f7a66;
  color:white;

  font-size:17px;
  font-weight:bold;
}

#status{
  margin-top:12px;
  color:#776e65;
  font-weight:bold;
  height:22px;
}
</style>
</head>

<body>

<div id="game">

  <div class="top">

    <h1>2048</h1>

    <div class="scores">

      <div class="box">
        SCORE
        <b id="score">0</b>
      </div>

      <div class="box">
        BEST
        <b id="best">0</b>
      </div>

    </div>

  </div>

  <div id="message">
    Swipe to move the tiles. Combine matching numbers!
  </div>

  <div id="board"></div>

  <div id="status"></div>

  <button id="restart">
    NEW GAME
  </button>

</div>

<script>

const board=document.getElementById("board");
const scoreText=document.getElementById("score");
const bestText=document.getElementById("best");
const statusText=document.getElementById("status");
const restart=document.getElementById("restart");

let grid=[];
let score=0;

let best=
Number(localStorage.getItem("2048Best")||0);

bestText.textContent=best;


/* =========================
   NEW GAME
========================= */

function newGame(){

  grid=[];

  score=0;

  statusText.textContent="";

  for(let r=0;r<4;r++){

    grid[r]=[];

    for(let c=0;c<4;c++){

      grid[r][c]=0;

    }

  }

  addTile();
  addTile();

  draw();

}


/* =========================
   ADD TILE
========================= */

function addTile(){

  let empty=[];

  for(let r=0;r<4;r++){

    for(let c=0;c<4;c++){

      if(grid[r][c]===0){

        empty.push([r,c]);

      }

    }

  }

  if(empty.length===0)
    return;

  let pos=
    empty[
      Math.floor(
        Math.random()*empty.length
      )
    ];

  grid[pos[0]][pos[1]]=
    Math.random()<0.9 ? 2 : 4;

}


/* =========================
   DRAW
========================= */

function draw(){

  board.innerHTML="";

  for(let r=0;r<4;r++){

    for(let c=0;c<4;c++){

      let cell=
        document.createElement("div");

      cell.className="cell";

      let value=grid[r][c];

      if(value!==0){

        cell.textContent=value;

        cell.classList.add(
          "tile"+value
        );

      }

      board.appendChild(cell);

    }

  }

  scoreText.textContent=score;

  if(score>best){

    best=score;

    bestText.textContent=best;

    localStorage.setItem(
      "2048Best",
      best
    );

  }

}


/* =========================
   MOVE ROW
========================= */

function moveRow(row){

  let arr=
    row.filter(x=>x!==0);

  let result=[];

  for(let i=0;i<arr.length;i++){

    if(
      i<arr.length-1 &&
      arr[i]===arr[i+1]
    ){

      let value=
        arr[i]*2;

      result.push(value);

      score+=value;

      i++;

    }else{

      result.push(arr[i]);

    }

  }

  while(result.length<4)
    result.push(0);

  return result;

}


/* =========================
   MOVE LEFT
========================= */

function moveLeft(){

  let changed=false;

  for(let r=0;r<4;r++){

    let old=
      [...grid[r]];

    let next=
      moveRow(grid[r]);

    grid[r]=next;

    if(
      old.join(",")!==
      next.join(",")
    ){

      changed=true;

    }

  }

  return changed;

}


/* =========================
   MOVE RIGHT
========================= */

function moveRight(){

  let changed=false;

  for(let r=0;r<4;r++){

    let old=
      [...grid[r]];

    let reversed=
      [...grid[r]].reverse();

    let next=
      moveRow(reversed).reverse();

    grid[r]=next;

    if(
      old.join(",")!==
      next.join(",")
    ){

      changed=true;

    }

  }

  return changed;

}


/* =========================
   MOVE UP
========================= */

function moveUp(){

  let changed=false;

  for(let c=0;c<4;c++){

    let column=[];

    for(let r=0;r<4;r++)
      column.push(grid[r][c]);

    let old=[...column];

    let next=
      moveRow(column);

    for(let r=0;r<4;r++)
      grid[r][c]=next[r];

    if(
      old.join(",")!==
      next.join(",")
    ){

      changed=true;

    }

  }

  return changed;

}


/* =========================
   MOVE DOWN
========================= */

function moveDown(){

  let changed=false;

  for(let c=0;c<4;c++){

    let column=[];

    for(let r=0;r<4;r++)
      column.push(grid[r][c]);

    let old=[...column];

    let next=
      moveRow(
        column.reverse()
      ).reverse();

    for(let r=0;r<4;r++)
      grid[r][c]=next[r];

    if(
      old.join(",")!==
      next.join(",")
    ){

      changed=true;

    }

  }

  return changed;

}


/* =========================
   CAN MOVE?
========================= */

function canMove(){

  for(let r=0;r<4;r++){

    for(let c=0;c<4;c++){

      if(grid[r][c]===0)
        return true;

      if(
        c<3 &&
        grid[r][c]===
        grid[r][c+1]
      )
        return true;

      if(
        r<3 &&
        grid[r][c]===
        grid[r+1][c]
      )
        return true;

    }

  }

  return false;

}


/* =========================
   MOVE
========================= */

function move(direction){

  let changed=false;

  if(direction==="left")
    changed=moveLeft();

  if(direction==="right")
    changed=moveRight();

  if(direction==="up")
    changed=moveUp();

  if(direction==="down")
    changed=moveDown();

  if(!changed)
    return;

  addTile();

  draw();

  if(!canMove()){

    statusText.textContent=
      "GAME OVER!";

  }

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
  "keydown",
  function(e){

    if(e.key==="ArrowLeft"){

      e.preventDefault();

      move("left");

    }

    if(e.key==="ArrowRight"){

      e.preventDefault();

      move("right");

    }

    if(e.key==="ArrowUp"){

      e.preventDefault();

      move("up");

    }

    if(e.key==="ArrowDown"){

      e.preventDefault();

      move("down");

    }

  }
);


/* =========================
   SWIPE
========================= */

let startX=0;
let startY=0;

board.addEventListener(
  "pointerdown",
  function(e){

    startX=e.clientX;
    startY=e.clientY;

  }
);

board.addEventListener(
  "pointerup",
  function(e){

    let dx=
      e.clientX-startX;

    let dy=
      e.clientY-startY;

    if(
      Math.abs(dx)<25 &&
      Math.abs(dy)<25
    )
      return;

    if(
      Math.abs(dx)>
      Math.abs(dy)
    ){

      if(dx>0)
        move("right");
      else
        move("left");

    }else{

      if(dy>0)
        move("down");
      else
        move("up");

    }

  }
);


/* =========================
   RESTART
========================= */

restart.addEventListener(
  "pointerdown",
  newGame
);


/* =========================
   START
========================= */

newGame();

</script>

</body>
  </html>
