<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>UMINE Racing Rush</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:monospace;
}

body{
    background:#05070a;
    color:white;
    text-align:center;
    overflow:hidden;
    touch-action:none;
    image-rendering:pixelated;
}

h1{
    margin:8px 0 3px;
    color:#00ff99;
    font-size:26px;
    text-shadow:3px 3px #063d2b;
}

#stats{
    display:flex;
    justify-content:center;
    gap:25px;
    font-size:16px;
    margin:4px;
}

#game{
    position:relative;
    width:min(94vw,420px);
    height:68vh;
    max-height:560px;
    min-height:420px;
    margin:auto;
    overflow:hidden;
    border:4px solid white;
    background:#6bc43d;
}

#sky{
    position:absolute;
    top:0;
    width:100%;
    height:25%;
    background:#55bce8;
}

#road{
    position:absolute;
    left:5%;
    width:90%;
    height:100%;
    overflow:hidden;

    background:
        linear-gradient(
            90deg,
            #777 0%,
            #333 9%,
            #202020 50%,
            #333 91%,
            #777 100%
        );

    clip-path:polygon(
        39% 0%,
        61% 0%,
        96% 100%,
        4% 100%
    );
}

.roadLine{
    position:absolute;
    width:6px;
    height:70px;
    background:white;
    left:50%;
    transform:translateX(-50%);
}

.line1{top:-80px;}
.line2{top:80px;}
.line3{top:240px;}
.line4{top:400px;}
.line5{top:560px;}

.side{
    position:absolute;
    width:18px;
    height:18px;
    background:#ffdf00;
}

.s1{left:2%;top:30%;}
.s2{right:2%;top:40%;}
.s3{left:3%;top:58%;}
.s4{right:3%;top:70%;}
.s5{left:5%;top:82%;}

#player{
    position:absolute;
    width:50px;
    height:82px;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    background:#00d9ff;
    border:4px solid white;
    z-index:10;

    box-shadow:6px 6px 0 #075c70;
}

#player .window{
    position:absolute;
    left:7px;
    top:10px;
    width:28px;
    height:23px;
    background:#17202b;
    border:3px solid white;
}

#player .stripe{
    position:absolute;
    left:20px;
    top:36px;
    width:6px;
    height:38px;
    background:white;
}

.wheel{
    position:absolute;
    width:10px;
    height:22px;
    background:#111;
}

.wl1{left:-8px;top:12px;}
.wl2{right:-8px;top:12px;}
.wl3{left:-8px;bottom:12px;}
.wl4{right:-8px;bottom:12px;}

.enemy{
    position:absolute;
    width:48px;
    height:78px;
    background:#ed2948;
    border:4px solid white;
    z-index:8;
    box-shadow:6px 6px 0 #781522;
}

.enemy .window{
    position:absolute;
    left:6px;
    top:9px;
    width:28px;
    height:22px;
    background:#17202b;
    border:3px solid white;
}

.enemy .stripe{
    position:absolute;
    left:20px;
    top:35px;
    width:6px;
    height:34px;
    background:#ffd400;
}

.enemy .wheel{
    position:absolute;
    width:9px;
    height:20px;
    background:#111;
}

.enemy .w1{left:-8px;top:10px;}
.enemy .w2{right:-8px;top:10px;}
.enemy .w3{left:-8px;bottom:10px;}
.enemy .w4{right:-8px;bottom:10px;}

#hint{
    font-size:13px;
    color:#aaa;
    margin:4px;
}

#gameOver{
    display:none;
    font-size:24px;
    margin:4px;
}

#restart{
    margin-top:5px;
    padding:9px 22px;
    border:3px solid white;
    background:#00ff99;
    color:#07100d;
    font-family:monospace;
    font-weight:bold;
    font-size:16px;
}
</style>
</head>

<body>

<h1>🏎️ RACING RUSH</h1>

<div id="stats">
    <div>🏆 SCORE: <span id="score">0</span></div>
    <div>⚡ SPEED: <span id="speed">1</span></div>
</div>

<div id="game">

    <div id="sky"></div>

    <div class="side s1"></div>
    <div class="side s2"></div>
    <div class="side s3"></div>
    <div class="side s4"></div>
    <div class="side s5"></div>

    <div id="road">

        <div class="roadLine line1"></div>
        <div class="roadLine line2"></div>
        <div class="roadLine line3"></div>
        <div class="roadLine line4"></div>
        <div class="roadLine line5"></div>

    </div>

    <div id="player">

        <div class="window"></div>
        <div class="stripe"></div>

        <div class="wheel wl1"></div>
        <div class="wheel wl2"></div>
        <div class="wheel wl3"></div>
        <div class="wheel wl4"></div>

    </div>

</div>

<div id="hint">
    👆 DRAG YOUR CAR LEFT / RIGHT
</div>

<div id="gameOver">
    💥 CRASH!
    <br>
    SCORE: <span id="finalScore">0</span>
    <br>
    <button id="restart">🔄 RESTART</button>
</div>

<script>

const game =
document.getElementById("game");

const player =
document.getElementById("player");

const scoreText =
document.getElementById("score");

const speedText =
document.getElementById("speed");

const finalScore =
document.getElementById("finalScore");

const gameOver =
document.getElementById("gameOver");

const restart =
document.getElementById("restart");

let playerX = 0;
let enemies = [];

let score = 0;

/*
    SPEED AB SCORE KE SAATH
    CONTINUOUSLY BADHEGI
*/
let speed = 1;

let running = false;
let lastTime = 0;
let spawnTimer = 0;
let animation;
let dragging = false;


/* START */

function startGame(){

    document
    .querySelectorAll(".enemy")
    .forEach(e => e.remove());

    enemies = [];

    score = 0;

    speed = 1;

    running = true;

    lastTime =
        performance.now();

    spawnTimer = 0;

    scoreText.textContent = "0";
    speedText.textContent = "1";
    finalScore.textContent = "0";

    gameOver.style.display = "none";

    playerX =
        game.clientWidth / 2;

    player.style.left =
        playerX + "px";

    cancelAnimationFrame(animation);

    animation =
        requestAnimationFrame(loop);
}


/* CREATE ENEMY */

function createEnemy(){

    const roadLeft =
        game.clientWidth * .23;

    const roadRight =
        game.clientWidth * .77;

    const lanes = 3;

    const laneWidth =
        (roadRight-roadLeft)/lanes;

    const lane =
        Math.floor(
            Math.random()*lanes
        );

    const x =
        roadLeft +
        lane*laneWidth +
        laneWidth/2 -
        24;

    const enemy =
        document.createElement("div");

    enemy.className = "enemy";

    enemy.innerHTML = `

        <div class="window"></div>
        <div class="stripe"></div>

        <div class="wheel w1"></div>
        <div class="wheel w2"></div>
        <div class="wheel w3"></div>
        <div class="wheel w4"></div>

    `;

    enemy.style.left =
        x + "px";

    enemy.style.top =
        "-90px";

    game.appendChild(enemy);

    enemies.push({

        element:enemy,
        x:x,
        y:-90,

        /*
           ENEMY SPEED BHI
           SCORE KE SAATH BADHEGI
        */
        speed:
            150 + speed * 35
    });
}


/* GAME LOOP */

function loop(time){

    if(!running){
        return;
    }

    const delta =
        Math.min(
            (time-lastTime)/1000,
            .04
        );

    lastTime = time;


    /*
       SCORE = SPEED

       Har 1 score par speed
       thodi increase hogi.

       0 score  = 1x
       1 score  = 1.12x
       5 score  = 1.60x
       10 score = 2.20x
       etc.
    */

    speed =
        1 + score * 0.12;

    speedText.textContent =
        speed.toFixed(1) + "x";


    /* ROAD SPEED */

    document
    .querySelectorAll(".roadLine")
    .forEach(line => {

        let y =
            parseFloat(
                line.dataset.y ||
                "-80"
            );

        y +=
            250 * speed * delta;

        if(
            y >
            game.clientHeight
        ){

            y -=
                game.clientHeight + 160;
        }

        line.dataset.y = y;

        line.style.top =
            y + "px";
    });


    /* SPAWN */

    spawnTimer += delta;

    /*
       Score badhega to cars
       bhi thodi jaldi spawn hongi.
    */

    const spawnRate =
        Math.max(
            .30,
            .85 - score * .012
        );

    if(
        spawnTimer >=
        spawnRate
    ){

        createEnemy();

        spawnTimer = 0;
    }


    /* ENEMIES */

    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const enemy =
            enemies[i];

        /*
           Enemy ki speed bhi
           current score se linked
        */

        enemy.y +=
            (
                150 +
                speed * 35
            ) * delta;

        enemy.element.style.top =
            enemy.y + "px";


        /* COLLISION */

        const pLeft =
            playerX-25;

        const pRight =
            playerX+25;

        const pTop =
            game.clientHeight-106;

        const pBottom =
            game.clientHeight-24;

        const eLeft =
            enemy.x;

        const eRight =
            enemy.x+48;

        const eTop =
            enemy.y;

        const eBottom =
            enemy.y+78;


        if(

            pLeft < eRight &&
            pRight > eLeft &&
            pTop < eBottom &&
            pBottom > eTop

        ){

            endGame();

            return;
        }


        /* PASSED */

        if(
            enemy.y >
            game.clientHeight
        ){

            enemy.element.remove();

            enemies.splice(i,1);

            /*
               SCORE +1

               Next frame me speed
               automatically increase hogi.
            */

            score++;

            scoreText.textContent =
                score;
        }
    }


    animation =
        requestAnimationFrame(loop);
}


/* DRAG */

function movePlayer(clientX){

    if(!running){
        return;
    }

    const rect =
        game.getBoundingClientRect();

    let x =
        clientX-rect.left;

    const min =
        game.clientWidth*.25;

    const max =
        game.clientWidth*.75;

    x =
        Math.max(
            min,
            Math.min(max,x)
        );

    playerX = x;

    player.style.left =
        playerX+"px";
}


/* POINTER DOWN */

game.addEventListener(
    "pointerdown",
    function(e){

        dragging = true;

        movePlayer(
            e.clientX
        );
    }
);


/* DRAG */

game.addEventListener(
    "pointermove",
    function(e){

        if(!dragging){
            return;
        }

        movePlayer(
            e.clientX
        );
    }
);


/* RELEASE */

game.addEventListener(
    "pointerup",
    function(){

        dragging = false;
    }
);

game.addEventListener(
    "pointercancel",
    function(){

        dragging = false;
    }
);


/* GAME OVER */

function endGame(){

    running = false;

    cancelAnimationFrame(
        animation
    );

    finalScore.textContent =
        score;

    gameOver.style.display =
        "block";
}


/* RESTART */

restart.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        startGame();
    }
);


/* START */

startGame();

</script>

</body>
  </html>
