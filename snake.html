<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UMINE Snake</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0b0d12;
    color:white;
    text-align:center;
    overflow:hidden;
}

h1{
    margin-top:18px;
    color:#00ff99;
}

#score{
    margin:10px;
    font-size:22px;
}

#game{
    position:relative;
    width:min(92vw,400px);
    height:min(92vw,400px);
    margin:15px auto;
    background:#151922;
    border:3px solid #00ff99;
    border-radius:12px;
    overflow:hidden;
}

.snake{
    position:absolute;
    width:5%;
    height:5%;
    background:#00ff99;
    border-radius:5px;
}

.food{
    position:absolute;
    width:5%;
    height:5%;
    background:#ff4050;
    border-radius:50%;
}

#controls{
    width:220px;
    margin:15px auto;
    display:grid;
    grid-template-columns:70px 70px 70px;
    gap:8px;
    justify-content:center;
}

.control{
    width:70px;
    height:60px;
    border:0;
    border-radius:12px;
    background:#202733;
    color:white;
    font-size:28px;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
}

.control:active{
    background:#00ff99;
    color:#07100d;
}

#up{
    grid-column:2;
}

#left{
    grid-column:1;
    grid-row:2;
}

#down{
    grid-column:2;
    grid-row:2;
}

#right{
    grid-column:3;
    grid-row:2;
}

#gameOver{
    display:none;
    font-size:28px;
    margin-top:15px;
}

#restart{
    margin-top:12px;
    padding:12px 25px;
    border:0;
    border-radius:10px;
    background:#00ff99;
    font-size:18px;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>🐍 UMINE Snake</h1>

<div id="score">Score: 0</div>

<div id="game"></div>

<div id="controls">

<button class="control" id="up">⬆️</button>
<button class="control" id="left">⬅️</button>
<button class="control" id="down">⬇️</button>
<button class="control" id="right">➡️</button>

</div>

<div id="gameOver">

💀 Game Over

<br>

<button id="restart">🔄 Restart</button>

</div>

<script>

const game = document.getElementById("game");
const scoreText = document.getElementById("score");
const gameOver = document.getElementById("gameOver");
const restart = document.getElementById("restart");

const grid = 20;

let snake;
let food;
let direction;
let nextDirection;
let score = 0;
let running = false;
let gameLoop = null;


/* START GAME */

function startGame(){

    snake = [
        {x:10,y:10},
        {x:9,y:10},
        {x:8,y:10}
    ];

    direction = {
        x:1,
        y:0
    };

    nextDirection = {
        x:1,
        y:0
    };

    score = 0;
    running = true;

    scoreText.textContent = "Score: 0";

    gameOver.style.display = "none";

    clearInterval(gameLoop);

    createFood();

    draw();

    gameLoop = setInterval(update,120);
}


/* FOOD */

function createFood(){

    do{

        food = {
            x:Math.floor(Math.random()*grid),
            y:Math.floor(Math.random()*grid)
        };

    }while(
        snake.some(part =>
            part.x === food.x &&
            part.y === food.y
        )
    );
}


/* DRAW */

function draw(){

    game.innerHTML = "";

    snake.forEach((part,index)=>{

        const element = document.createElement("div");

        element.className = "snake";

        element.style.left = (part.x * 5) + "%";
        element.style.top = (part.y * 5) + "%";

        if(index === 0){
            element.style.background = "#ffffff";
        }

        game.appendChild(element);
    });


    const foodElement = document.createElement("div");

    foodElement.className = "food";

    foodElement.style.left = (food.x * 5) + "%";
    foodElement.style.top = (food.y * 5) + "%";

    game.appendChild(foodElement);
}


/* GAME UPDATE */

function update(){

    if(!running){
        return;
    }

    direction = nextDirection;


    const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
    };


    /* WALL COLLISION */

    if(
        head.x < 0 ||
        head.x >= grid ||
        head.y < 0 ||
        head.y >= grid
    ){

        endGame();
        return;
    }


    const eating =
        head.x === food.x &&
        head.y === food.y;


    /*
      Agar food nahi khaya,
      tail remove karo.
    */

    if(!eating){
        snake.pop();
    }


    /* BODY COLLISION */

    if(
        snake.some(part =>
            part.x === head.x &&
            part.y === head.y
        )
    ){

        endGame();
        return;
    }


    snake.unshift(head);


    /* FOOD */

    if(eating){

        score++;

        scoreText.textContent =
            "Score: " + score;

        createFood();
    }


    draw();
}


/* CHANGE DIRECTION */

function changeDirection(x,y){

    /*
      Snake ko directly opposite
      direction me nahi jaane denge.
    */

    if(
        direction.x === -x &&
        direction.y === -y
    ){
        return;
    }

    nextDirection = {
        x:x,
        y:y
    };
}


/* GAME OVER */

function endGame(){

    running = false;

    clearInterval(gameLoop);

    gameLoop = null;

    gameOver.style.display = "block";
}


/* MOBILE BUTTONS */

document.getElementById("up")
.addEventListener("pointerdown",function(e){

    e.preventDefault();

    if(running){
        changeDirection(0,-1);
    }
});


document.getElementById("down")
.addEventListener("pointerdown",function(e){

    e.preventDefault();

    if(running){
        changeDirection(0,1);
    }
});


document.getElementById("left")
.addEventListener("pointerdown",function(e){

    e.preventDefault();

    if(running){
        changeDirection(-1,0);
    }
});


document.getElementById("right")
.addEventListener("pointerdown",function(e){

    e.preventDefault();

    if(running){
        changeDirection(1,0);
    }
});


/* KEYBOARD */

document.addEventListener("keydown",function(e){

    if(e.key === "ArrowUp"){
        changeDirection(0,-1);
    }

    if(e.key === "ArrowDown"){
        changeDirection(0,1);
    }

    if(e.key === "ArrowLeft"){
        changeDirection(-1,0);
    }

    if(e.key === "ArrowRight"){
        changeDirection(1,0);
    }
});


/* RESTART */

restart.addEventListener("pointerdown",function(e){

    e.preventDefault();

    startGame();
});


/* START */

startGame();

</script>

</body>
</html>
