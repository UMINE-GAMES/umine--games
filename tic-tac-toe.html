<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Tic Tac Toe</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
touch-action:none;
font-family:Arial,sans-serif;
background:#111827;
}

#game{
min-height:100vh;

display:flex;
flex-direction:column;
align-items:center;

padding-top:30px;
}

h1{
color:white;
font-size:40px;
margin-bottom:12px;
}

#turn{
color:#cbd5e1;
font-size:19px;
font-weight:bold;

margin-bottom:18px;
}

#board{
width:330px;
height:330px;
max-width:90vw;
max-height:90vw;

display:grid;

grid-template-columns:repeat(3,1fr);
grid-template-rows:repeat(3,1fr);

gap:8px;
}

.cell{
background:#334155;

border:3px solid #475569;

border-radius:12px;

display:flex;
align-items:center;
justify-content:center;

font-size:55px;
font-weight:bold;

color:white;
}

.cell.x{
color:#38bdf8;
}

.cell.o{
color:#fb7185;
}

#status{
height:30px;

margin-top:20px;

color:#facc15;

font-size:20px;
font-weight:bold;
}

button{
margin-top:12px;

padding:13px 30px;

border:2px solid white;

border-radius:10px;

background:#2563eb;

color:white;

font-size:18px;

font-weight:bold;
}

</style>

</head>

<body>

<div id="game">

<h1>❌ TIC TAC TOE</h1>

<div id="turn">
Your turn — X
</div>

<div id="board"></div>

<div id="status"></div>

<button id="restart">
NEW GAME
</button>

</div>


<script>

const board=
document.getElementById("board");

const turn=
document.getElementById("turn");

const status=
document.getElementById("status");

const restart=
document.getElementById("restart");


let cells=[];

let current="X";

let gameOver=false;


/* =========================
   START GAME
========================= */

function startGame(){

board.innerHTML="";

cells=[];

current="X";

gameOver=false;

status.textContent="";

turn.textContent=
"Your turn — X";


for(let i=0;i<9;i++){

let cell=
document.createElement("div");

cell.className="cell";

cell.addEventListener(
"pointerdown",
function(e){

e.preventDefault();

playerMove(i);

}
);

board.appendChild(cell);

cells.push(cell);

}

}


/* =========================
   PLAYER MOVE
========================= */

function playerMove(index){

if(gameOver)
return;

if(cells[index].textContent!=="")
return;


cells[index].textContent="X";

cells[index].classList.add("x");


if(checkWinner("X")){

status.textContent=
"🏆 YOU WIN!";

gameOver=true;

return;

}


if(isDraw()){

status.textContent=
"🤝 DRAW!";

gameOver=true;

return;

}


turn.textContent=
"Computer is thinking...";


setTimeout(
computerMove,
350
);

}


/* =========================
   COMPUTER
========================= */

function computerMove(){

if(gameOver)
return;


let empty=[];

for(let i=0;i<9;i++){

if(cells[i].textContent===""){

empty.push(i);

}

}


if(empty.length===0)
return;


/* Try to win */

let winningMove=
findWinningMove("O");


if(winningMove!==-1){

makeComputerMove(
winningMove
);

return;

}


/* Block player */

let blockMove=
findWinningMove("X");


if(blockMove!==-1){

makeComputerMove(
blockMove
);

return;

}


/* Center */

if(
cells[4].textContent===""
){

makeComputerMove(4);

return;

}


/* Corners */

let corners=[
0,2,6,8
];

let availableCorners=
corners.filter(
i=>cells[i].textContent===""
);


if(availableCorners.length){

let move=
availableCorners[
Math.floor(
Math.random()*
availableCorners.length
)
];

makeComputerMove(move);

return;

}


/* Random */

let move=
empty[
Math.floor(
Math.random()*empty.length
)
];

makeComputerMove(move);

}


/* =========================
   COMPUTER MOVE
========================= */

function makeComputerMove(index){

if(gameOver)
return;


cells[index].textContent="O";

cells[index].classList.add("o");


if(checkWinner("O")){

status.textContent=
"💥 COMPUTER WINS!";

gameOver=true;

return;

}


if(isDraw()){

status.textContent=
"🤝 DRAW!";

gameOver=true;

return;

}


turn.textContent=
"Your turn — X";

}


/* =========================
   FIND WINNING MOVE
========================= */

function findWinningMove(symbol){

for(let i=0;i<9;i++){

if(
cells[i].textContent!==""
)
continue;


cells[i].textContent=symbol;


let win=
checkWinner(symbol);


cells[i].textContent="";


if(win)
return i;

}

return -1;

}


/* =========================
   WIN CHECK
========================= */

function checkWinner(symbol){

const wins=[

[0,1,2],
[3,4,5],
[6,7,8],

[0,3,6],
[1,4,7],
[2,5,8],

[0,4,8],
[2,4,6]

];


return wins.some(
line=>line.every(
i=>cells[i].textContent===symbol
)
);

}


/* =========================
   DRAW
========================= */

function isDraw(){

return cells.every(
cell=>cell.textContent!==""
);

}


/* =========================
   RESTART
========================= */

restart.addEventListener(
"pointerdown",
function(e){

e.preventDefault();

startGame();

}
);


/* =========================
   START
========================= */

startGame();

</script>

</body>
</html>
